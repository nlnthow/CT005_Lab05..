<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Infographic và video về lợi ích của công nghệ số trong học tập.">
    <title>Lợi ích của công nghệ số trong học tập</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef8ff, #ffffff);
            color: #10105f;
            line-height: 1.6;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        header p {
            color: #3faeb3;
            font-size: clamp(1.05rem, 2.5vw, 1.5rem);
            font-weight: 700;
        }

        .card {
            background: #fff;
            border-radius: 22px;
            padding: 24px;
            margin: 25px 0;
            box-shadow: 0 10px 30px rgba(20, 40, 100, 0.12);
        }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .infographic {
            display: block;
            width: 100%;
            max-width: 850px;
            height: auto;
            margin: 0 auto;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .youtube-link {
            display: inline-block;
            margin-top: 16px;
            padding: 11px 18px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
        }

        .youtube-link:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 30px 15px 45px;
            color: #555;
            font-size: 0.95rem;
        }

        .source {
            margin-top: 8px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 30px;
            }

            .card {
                padding: 14px;
                border-radius: 16px;
            }

            .section-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Lợi ích của công nghệ số trong học tập</h1>
            <p>Mở rộng cơ hội học tập, kết nối tri thức</p>
        </header>

        <section class="card">
            <h2 class="section-title">📊 Infographic</h2>

            <!-- Infographic được nhúng trực tiếp vào file HTML -->
            <img
                class="infographic"
                d:\MauBaoCao\Lab05_Ex_2.1.png
                alt="Infographic: Lợi ích của công nghệ số trong học tập"
            >
        </section>

        <section class="card">
            <h2 class="section-title">🎥 Video YouTube</h2>

            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/8OjcJTNQXv0"
                    title="Video về công nghệ số trong học tập"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <div style="text-align:center;">
                <a
                    class="youtube-link"
                    href="https://youtu.be/8OjcJTNQXv0"
                    target="_blank"
                    rel="noopener noreferrer">
                    Xem video trên YouTube
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p><strong>Lab5_Ex3.1</strong> – Trang HTML hiển thị nội dung đa phương tiện</p>
        <p class="source">Nguồn thực hiện: hỗ trợ bởi AI / GitHub Copilot</p>
    </footer>
</body>
</html>
